<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Gallery</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <h1>My Image Gallery</h1>
    <p>Explore beautiful photographs</p>

    <!-- Category Filter Buttons -->
    <div class="filters">
      <button onclick="filterImages('all')">All</button>
      <button onclick="filterImages('nature')">Nature</button>
      <button onclick="filterImages('city')">City</button>
      <button onclick="filterImages('animals')">Animals</button>
      <button onclick="filterImages('travel')">Travel</button>
    </div>

    <!-- Image Gallery -->
    <div class="gallery">
      <div class="image-card nature">
        <img
          src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?w=600"
          alt="Nature"
        />
        <h3>Beautiful Nature</h3>
      </div>

      <div class="image-card city">
        <img
          src="https://images.unsplash.com/photo-1519501025264-65ba15a82390?w=600"
          alt="City"
        />
        <h3>Beautiful City</h3>
      </div>

      <div class="image-card animals">
        <img
          src="https://images.unsplash.com/photo-1543466835-00a7907e9de1?w=600"
          alt="Dog"
        />
        <h3>Cute Dog</h3>
      </div>
      <div class="image-card animals">
        <img
          src="https://images.unsplash.com/photo-1514888286974-6c03e2ca1dba?w=600"
          alt="Cute Cat"
        />
        <h3>Cute Cat</h3>
      </div>

      <div class="image-card animals">
        <img
          src="https://images.unsplash.com/photo-1552053831-71594a27632d?w=600"
          alt="Golden Dog"
        />
        <h3>Golden Dog</h3>
      </div>
      <div class="image-card nature">
        <img
          src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e?w=600"
          alt="Mountain"
        />
        <h3>Mountains</h3>
      </div>
      <!-- Travel Images -->

      <div class="image-card travel">
        <img
          src="https://images.unsplash.com/photo-1501785888041-af3ef285b470?w=600"
          alt="Beautiful Lake"
        />
        <h3>Beautiful Lake</h3>
      </div>

      <div class="image-card travel">
        <img
          src="https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?w=600"
          alt="Mountain Travel"
        />
        <h3>Mountain Travel</h3>
      </div>
    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
      <button id="prevImage">❮</button>
      <button id="nextImage">❯</button>
      <span id="closeLightbox" class="close">&times;</span>
      <img id="lightboxImage" src="" alt="Large View" />
    </div>

    <script src="script.js"></script>
  </body>
</html>
